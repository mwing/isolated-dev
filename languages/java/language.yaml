name: java
display_name: Java
versions: ["17", "21"]

detection:
  files: ["pom.xml", "build.gradle", "*.java"]

# Egress destinations a build or dependency install needs, used by
# `network: allowlist`.
registries:
  - repo.maven.apache.org
  - repo1.maven.org
  - deb.debian.org
  - security.debian.org

ports: [8080]

files:
  dockerfile: Dockerfile.template
  scaffolding: [".gitignore", "pom.xml", "Main.java"]