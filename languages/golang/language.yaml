name: golang
display_name: Go
versions: ["1.21", "1.22", "1.25"]

detection:
  files: [go.mod, main.go]
  version_files:
    - file: go.mod
      extract: "go ([0-9]+\\.[0-9]+)"

# Egress destinations a build or dependency install needs, used by
# `network: allowlist`.
registries:
  - proxy.golang.org
  - sum.golang.org
  - storage.googleapis.com
  - deb.debian.org
  - security.debian.org

ports: [8080, 8000, 3000]

files:
  dockerfile: Dockerfile.template
  scaffolding: [go.mod, main.go, .gitignore]