name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Keyless signing: cosign exchanges this for a short-lived certificate
  # bound to this workflow, so there is no key anywhere to leak.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # goreleaser derives the changelog from history, and a shallow
          # clone gives it one commit to describe.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # An exact patch, not '1.26'. setup-go matches the runner's cached
          # toolchain when the constraint allows it, so '1.26' sat on
          # 1.26.5 while 1.26.6 carried the fix for GO-2026-6090 in
          # crypto/tls — a stdlib vulnerability shipped inside every
          # released binary. Pinning has the cost this tool argues about
          # for image digests: the ground stops moving, and patches stop
          # arriving on their own. govulncheck below is what says to move
          # it.
          go-version: '1.26.6'

      # The suite runs on every push already; it runs again here because a
      # tag is the one build that people install without reading anything.
      - name: Test
        run: go test -race ./...

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.4.1

      # Two different things are pinned here, and only one of them can be a
      # commit. The action is pinned by SHA above, like every other action.
      # `version` selects the goreleaser CLI and takes a semver only — for
      # the record, v2.17.1 is tag object 408e5a74 pointing at commit
      # 83f4c19a5c5c0b9efef6bf2aedc6805bbcb9dfe2.
      #
      # It is also the version this config validates against: `formats` and
      # `homebrew_casks` are both newer than v2.5, and pinning to something
      # that cannot read the config is a broken pin, not a safe one — the
      # mistake made once already with golangci-lint.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the formula to mwing/homebrew-tap, which the workflow's
          # own token cannot reach. Without it the release still publishes
          # and the formula is skipped.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      # Versioned casks accumulate, one per release. Homebrew can only
      # install a version the tap still carries, so "keep the last few"
      # is a real operation rather than a policy statement.
      #
      # Failure here must not fail the release: the binaries are published
      # and signed by this point, and a tap left with extra files is untidy
      # rather than broken.
      - name: Prune old versioned casks
        continue-on-error: true
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          KEEP: '3'
        run: |
          set -euo pipefail
          # Guarded here rather than in `if`: a step's own env is not
          # dependable in its own condition, and a secret is not readable
          # there at all — the check would have been silently always-false.
          if [ -z "${TAP_GITHUB_TOKEN:-}" ]; then
            echo "no tap token; nothing to prune"
            exit 0
          fi

          git clone --depth 1 \
            "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/mwing/homebrew-tap.git" tap
          cd tap

          shopt -s nullglob
          files=(Casks/dev@*.rb)
          if [ "${#files[@]}" -le "$KEEP" ]; then
            echo "${#files[@]} versioned cask(s); keeping all"
            exit 0
          fi

          # sort -V, so 0.10.0 sorts after 0.9.0 — which plain sort gets
          # wrong in exactly the release that makes it matter.
          #
          # A while-read loop rather than mapfile: mapfile needs bash 4, so
          # the script could not be tried on a mac before shipping it, and
          # an untested release step is one that runs for the first time
          # when it matters.
          sorted=()
          while IFS= read -r line; do
            sorted+=("$line")
          done < <(printf '%s\n' "${files[@]}" | sort -V)

          drop=$(( ${#sorted[@]} - KEEP ))
          echo "keeping the newest $KEEP of ${#sorted[@]}"
          for f in "${sorted[@]:0:$drop}"; do
            echo "removing $f"
            git rm -q "$f"
          done

          git -c user.name='goreleaser' \
              -c user.email='goreleaser@users.noreply.github.com' \
              commit -m "Prune versioned casks, keeping the newest $KEEP"
          git push
