name: Go

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Fuzzing finds in minutes what it will not find in seconds, and a PR
    # cannot afford minutes. The weekly run is where the deeper search
    # happens; the per-push burst only has to catch regressions.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    # M0 exit criterion: the binary builds and the suite passes on both
    # platforms. Linux has no OrbStack, which is precisely why the backend
    # probe is behind an injected PATH lookup.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # An exact patch, not '1.26'. setup-go matches the runner's cached
          # toolchain when the constraint allows it, so '1.26' sat on
          # 1.26.5 while 1.26.6 carried the fix for GO-2026-6090 in
          # crypto/tls — a stdlib vulnerability shipped inside every
          # released binary. Pinning has the cost this tool argues about
          # for image digests: the ground stops moving, and patches stop
          # arriving on their own. govulncheck below is what says to move
          # it.
          go-version: '1.26.6'

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  # The tier that needs a daemon. Every bug the project's review found
  # survived a green suite because the tests stopped above docker: a fake
  # runner will happily report that a network was internal or a container
  # ran. Linux runners have a daemon, so this is where those claims get
  # checked against the thing that decides them.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Exact patch; see the note in the `test` job.
          go-version: '1.26.6'
      - name: Integration tests against a real docker daemon
        env:
          DEV_BACKEND: docker
        run: go test -tags=integration ./internal/cli/ -run Integration -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Exact patch; see the note in the `test` job.
          go-version: '1.26.6'
      # v7 of the action, because the config is golangci-lint v2 and v6 of
      # the action refuses a v2 version outright. That mismatch is why this
      # job had been failing on every push: `version: latest` resolved to a
      # v2 release the action could not install.
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          # Pinned: `latest` is a build that changes under you, which is the
          # same argument this tool makes about image tags.
          #
          # It has to be a release built with a Go at least as new as the one
          # go.mod targets — golangci-lint refuses to load a config for a
          # newer language version than it was compiled against. Raising the
          # `go` directive means raising this too.
          version: v2.12.2

  # The parsers that read bytes an attacker chooses: the TLS ClientHello the
  # proxy reads a server name out of, the allowlist entries that decide what
  # a container may reach, and the DNS names the resolver screens. Every one
  # of them has already had a bug that a hand-written test did not have the
  # imagination to write — a handshake split across two records read as "no
  # SNI", which is the allow branch, and allowlist entries that printed back
  # as something that no longer parsed.
  #
  # The seed corpora under testdata/fuzz run as ordinary tests in the job
  # above, so past findings stay fixed even if this job is skipped.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParseClientHello, FuzzParseAllowlist, FuzzSuspiciousQuery, FuzzSOCKSRequest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Exact patch; see the note in the `test` job.
          go-version: '1.26.6'
      - name: Fuzz ${{ matrix.target }}
        env:
          FUZZTIME: ${{ github.event_name == 'schedule' && '600s' || '60s' }}
        # Twice on failure, and only on failure.
        #
        # Go's fuzzing reports `context deadline exceeded` when the
        # -fuzztime deadline lands while a worker is mid-exchange: no
        # crasher, no corpus entry, a red build for finishing on time. That
        # blocked a release once, which is the wrong thing to spend a
        # release on.
        #
        # A retry cannot hide a real finding. A crasher is written into
        # testdata/fuzz and replayed as a seed on the next run, so the
        # second attempt fails in the first second rather than the last.
        run: |
          fuzz() {
            go test ./internal/netpolicy/ -run '^$' \
              -fuzz='^${{ matrix.target }}$' -fuzztime="$FUZZTIME"
          }
          fuzz || { echo "retrying once: a deadline race leaves no crasher behind"; fuzz; }
      - name: Show the failing input
        if: failure()
        # The corpus entry is the whole finding, and it is written inside
        # the runner. Printed here so it can be copied into testdata/ from
        # the log rather than reproduced by guesswork.
        #
        # Asked of git rather than of mtimes: `find -newer` matched every
        # committed seed, because checkout writes them all at once — so a
        # real finding arrived buried in a list of inputs that were already
        # fixed.
        run: |
          git status --porcelain --untracked-files=all internal/netpolicy/testdata/fuzz \
            | awk '{print $2}' | tee /dev/stderr | xargs -r -I{} sh -c 'echo "--- {}"; cat {}'
          git status --porcelain internal/netpolicy/testdata/fuzz | grep -q . \
            || echo "no new corpus entry: the failure was not a finding"

  # The release config is only exercised by a tag, which is the worst
  # moment to learn it does not parse: v0.5.0 failed here on a field that
  # does not exist in HomebrewCask, after the tag was already pushed. This
  # runs on every push instead.
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Exact patch; see the note in the `test` job.
          go-version: '1.26.6'
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          # The same version the release uses. Checking against a different
          # one would answer a question nobody asked.
          version: v2.17.1
          args: check

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Exact patch; see the note in the `test` job.
          go-version: '1.26.6'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
