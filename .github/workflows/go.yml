name: Go

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    # M0 exit criterion: the binary builds and the suite passes on both
    # platforms. Linux has no OrbStack, which is precisely why the backend
    # probe is behind an injected PATH lookup.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  # The tier that needs a daemon. Every bug the project's review found
  # survived a green suite because the tests stopped above docker: a fake
  # runner will happily report that a network was internal or a container
  # ran. Linux runners have a daemon, so this is where those claims get
  # checked against the thing that decides them.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Integration tests against a real docker daemon
        env:
          DEV_BACKEND: docker
        run: go test -tags=integration ./internal/cli/ -run Integration -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v6
        with:
          # Pinned: `latest` is a build that changes under you, which is the
          # same argument this tool makes about image tags. It also broke —
          # a transitive dependency of a newer release stopped resolving.
          version: v2.5.0

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
