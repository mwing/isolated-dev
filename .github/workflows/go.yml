name: Go

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    # M0 exit criterion: the binary builds and the suite passes on both
    # platforms. Linux has no OrbStack, which is precisely why the backend
    # probe is behind an injected PATH lookup.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  # The tier that needs a daemon. Every bug the project's review found
  # survived a green suite because the tests stopped above docker: a fake
  # runner will happily report that a network was internal or a container
  # ran. Linux runners have a daemon, so this is where those claims get
  # checked against the thing that decides them.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
      - name: Integration tests against a real docker daemon
        env:
          DEV_BACKEND: docker
        run: go test -tags=integration ./internal/cli/ -run Integration -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
      # v7 of the action, because the config is golangci-lint v2 and v6 of
      # the action refuses a v2 version outright. That mismatch is why this
      # job had been failing on every push: `version: latest` resolved to a
      # v2 release the action could not install.
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          # Pinned: `latest` is a build that changes under you, which is the
          # same argument this tool makes about image tags.
          #
          # It has to be a release built with a Go at least as new as the one
          # go.mod targets — golangci-lint refuses to load a config for a
          # newer language version than it was compiled against. Raising the
          # `go` directive means raising this too.
          version: v2.12.2

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
