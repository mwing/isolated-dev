name: Test Suite (v1, bash)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq shellcheck

    - name: ShellCheck
      run: |
        # Gate at error level for now; warning-level cleanup is tracked separately
        shellcheck -S error v1/scripts/dev v1/scripts/lib/*.sh v1/install.sh v1/test.sh v1/integration-test.sh

    - name: Run syntax and basic tests
      run: |
        # Run syntax validation and tests that don't require OrbStack
        bash -n v1/install.sh
        bash -n v1/scripts/dev
        find v1/scripts/lib -name "*.sh" -exec bash -n {} \;
        
        # Run limited test suite (syntax, help, structure tests only)
        # Skip OrbStack-dependent tests in CI
        export CI=true
        cd v1 && bash test.sh